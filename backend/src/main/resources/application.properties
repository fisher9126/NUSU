spring.application.name=nusu-backend
server.port=8080
server.error.include-message=always

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nusu}
spring.datasource.username=${DB_USER:nusu}
spring.datasource.password=${DB_PASSWORD:nusu}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
