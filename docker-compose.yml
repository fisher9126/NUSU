services:
  database:
    image: postgres:15-alpine
    container_name: nusu-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nusu-data:/var/lib/postgresql/data
    networks:
      - nusu-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: nusu-backend
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - nusu-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: nusu-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - backend
    networks:
      - nusu-net
    restart: unless-stopped

volumes:
  nusu-data:

networks:
  nusu-net:
